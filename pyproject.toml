[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-sentinel"
version = "1.0.0"
description = "Offline X.509 certificate inventory and expiry auditor with a strict pure-Python DER parser, rule engine and text/JSON/HTML reports."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Jeremy da Costa", email = "357285436+jeremydacosta-TechOptimist@users.noreply.github.com" },
]
keywords = ["x509", "certificates", "tls", "pki", "certificate-expiry", "der", "audit", "security"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Security :: Cryptography",
  "Topic :: System :: Networking",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
certsentinel = "certsentinel.cli:main"

[project.urls]
Homepage = "https://github.com/jeremydacosta-TechOptimist/cert-sentinel"
Issues = "https://github.com/jeremydacosta-TechOptimist/cert-sentinel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
